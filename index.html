<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Pro Fix</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e24; border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; margin: 5px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .on { background: #27ae60; color: white; }
        .off { background: #c0392b; color: white; }
        #log { font-size: 10px; color: #888; text-align: left; height: 100px; overflow-y: auto; background: #000; padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>LED Controller v2.0</h2>
    <div class="card">
        <button onclick="initBT()" style="background: #7b2ffb; color: white;">1. POŁĄCZ Z LED</button>
        <p id="status">Status: Rozłączony</p>
    </div>

    <div class="card">
        <button class="on" onclick="sendCMD('fbeb0101')">WŁĄCZ</button>
        <button class="off" onclick="sendCMD('fbeb0100')">WYŁĄCZ</button>
    </div>

    <div id="log">Logi systemowe:</div>

    <script>
        let ledChar = null;

        function updateLog(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `> ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function initBT() {
            try {
                updateLog("Szukanie urządzenia...");
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
                });

                updateLog("Łączenie z GATT...");
                const server = await device.gatt.connect();
                
                updateLog("Pobieranie serwisu...");
                const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
                
                updateLog("Pobieranie charakterystyki...");
                ledChar = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
                
                document.getElementById('status').innerText = "✅ Połączono: " + device.name;
                updateLog("Gotowy do pracy!");

                // Opcjonalny handshake dla HiLighting
                await sendCMD('fbeb0000'); 
            } catch (e) {
                updateLog("BŁĄD: " + e.message);
                console.error(e);
            }
        }

        async function sendCMD(hex) {
            if (!ledChar) {
                updateLog("Błąd: Brak połączenia!");
                return;
            }
            try {
                const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                
                // Próba zapisu bez odpowiedzi (najszybsza)
                try {
                    await ledChar.writeValueWithoutResponse(bytes);
                    updateLog("Wysłano: " + hex);
                } catch (inner) {
                    // Próba zapisu z odpowiedzią (jeśli telefon blokuje pierwszy tryb)
                    await ledChar.writeValueWithResponse(bytes);
                    updateLog("Wysłano (WithResponse): " + hex);
                }
            } catch (err) {
                updateLog("Błąd wysyłania: " + err.message);
            }
        }
    </script>
</body>
</html>

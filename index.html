<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Pilot LED Pro</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 20px; }
        button { padding: 15px 25px; font-size: 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; min-width: 120px; }
        .on { background: #27ae60; color: white; }
        .off { background: #c0392b; color: white; }
        .red { background: #ff4d4d; } .green { background: #2ecc71; } .blue { background: #3498db; }
        #log { background: #000; color: #0f0; padding: 15px; border-radius: 5px; text-align: left; font-family: monospace; height: 150px; overflow-y: auto; margin-top: 20px; font-size: 12px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>🚀 Mój Pilot LED</h1>
    
    <div class="btn-group">
        <button class="on" onclick="runTest('ON')">WŁĄCZ</button>
        <button class="off" onclick="runTest('OFF')">WYŁĄCZ</button>
    </div>

    <div class="btn-group">
        <button class="red" onclick="sendSingle('7e070503ff000000ef')">CZERWONY</button>
        <button class="green" onclick="sendSingle('7e07050300ff0000ef')">ZIELONY</button>
        <button class="blue" onclick="sendSingle('7e0705030000ff00ef')">NIEBIESKI</button>
    </div>

    <h3>Dziennik zdarzeń (Logi):</h3>
    <div id="log">Czekam na akcję...</div>

    <script>
        let ledChar = null;

        const codes = {
            ON: ['7e0404010005ff00', '7e00040100000000', '5501010100', 'fbeb0101'],
            OFF: ['7e0404000005ff00', '7e00040000000000', '5501010000', 'fbeb0100']
        };

        function writeLog(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `> ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function getChar() {
            if (ledChar) return ledChar;
            writeLog("Szukam urządzenia...");
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
            });
            writeLog("Łączenie z " + device.name);
            const server = await device.gatt.connect();
            const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
            ledChar = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');
            return ledChar;
        }

        async function runTest(type) {
            try {
                const char = await getChar();
                for (let hex of codes[type]) {
                    writeLog(`Wysyłam kod ${type}: ${hex}`);
                    const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                    await char.writeValueWithoutResponse(bytes);
                    await new Promise(r => setTimeout(r, 300));
                }
            } catch (e) { writeLog("BŁĄD: " + e); }
        }

        async function sendSingle(hex) {
            try {
                const char = await getChar();
                writeLog(`Wysyłam kolor: ${hex}`);
                const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                await char.writeValueWithoutResponse(bytes);
            } catch (e) { writeLog("BŁĄD: " + e); }
        }
    </script>
</body>
</html>
